[package]
name = "mainsense"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Linux hardware telemetry for CPUs, AMD GPUs, memory, and sensors"
license = "MIT"
repository = "https://github.com/Mainkill1/MainSense"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28.1"
libc = "0.2"
serde_json = "1.0"
unicode-width = "0.2"
