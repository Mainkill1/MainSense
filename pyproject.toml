[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mainsense"
version = "0.1.0"
description = "Linux hardware telemetry for CPUs, AMD GPUs, memory, and sensors"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Repository = "https://github.com/Mainkill1/MainSense"
Issues = "https://github.com/Mainkill1/MainSense/issues"
Releases = "https://github.com/Mainkill1/MainSense/releases"

[project.scripts]
mainsense = "mainsense.__main__:main"

[tool.setuptools.packages.find]
include = ["mainsense*"]
